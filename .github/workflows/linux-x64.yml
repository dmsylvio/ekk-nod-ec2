name: Linux x64 build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux-x64.yml'
      - 'projects/LINUX/**'
      - 'cs2/**'
      - 'apex/**'
      - 'library/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux x64 executable
        shell: bash
        run: |
          mkdir -p dist/ekk-linux-x64
          g++ -std=c++20 -O2 -pthread -Ilibrary/SDL3/include \
            projects/LINUX/main.cpp \
            cs2/shared/cs2.cpp cs2/shared/cs2features.cpp \
            apex/shared/apex.cpp apex/shared/apexfeatures.cpp \
            library/vm/linux/vm.cpp projects/LINUX/libSDL3.so.0.0.0 \
            -Wl,-rpath,'$ORIGIN' -o dist/ekk-linux-x64/ekk-linux
          cp projects/LINUX/libSDL3.so.0.0.0 dist/ekk-linux-x64/libSDL3.so.0
          readelf -h dist/ekk-linux-x64/ekk-linux
          ldd dist/ekk-linux-x64/ekk-linux | tee dist/dependencies.txt
          if grep -q 'not found' dist/dependencies.txt; then exit 1; fi
          tar -C dist -czf dist/ekk-linux-x64.tar.gz ekk-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ekk-linux-x64
          path: dist/ekk-linux-x64.tar.gz
          if-no-files-found: error
